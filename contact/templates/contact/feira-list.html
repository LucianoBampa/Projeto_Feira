{% extends "global/base.html" %}

{% block content %}
    {% if feira_list %}
        <h1>tem feira</h1>
        {% for feira in feira_list %}
            <a href="{{feira.get_absolute_url}}">{{ feira.nome }}<a>  
        {% endfor %}
    {% else %}
        <h1>nenhuma</h1>
    {% endif %}
{% endblock %}
