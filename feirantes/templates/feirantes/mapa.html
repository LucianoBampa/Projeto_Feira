{% extends 'feirantes/base.html' %}
{% load static %}

{% block title %}Mapa das Feiras{% endblock %}

{% block content %}
<h2 class="mb-4">Mapa das Feiras</h2>

<div id="mapa" style="height: 500px; width: 100%;"></div>

<div class="mt-3 p-3 bg-light rounded">
    <h5>Informações:</h5>
    <p>Feiras carregadas: <span id="feiras-count">0</span></p>
    <p>Marcadores adicionados: <span id="markers-count">0</span></p>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

<script>
    const feiras = {{ feiras_json|safe }};
    const feiraIconUrl = "{% static 'global/img/marker-verde.png' %}";
    const userIconUrl = "{% static 'global/img/user-marker.png' %}";

    document.addEventListener("DOMContentLoaded", function () {
        const mapa = L.map('mapa').setView([-20.5560, -48.5678], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(mapa);

        let marcadores = [];

        // Ícones
        const feiraIcon = L.icon({
            iconUrl: feiraIconUrl,
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
            shadowSize: [41, 41],
            shadowAnchor: [12, 41]
        });

        const userIcon = L.icon({
            iconUrl: userIconUrl,
            iconSize: [35, 35],
            iconAnchor: [17, 35]
        });

        // Marcadores das feiras
        feiras.forEach(f => {
            if (f.latitude && f.longitude) {
                const marker = L.marker([f.latitude, f.longitude], { icon: feiraIcon }).addTo(mapa)
                    .bindPopup(`
                        <strong>${f.nome}</strong><br>
                        ${f.endereco}, ${f.cidade} - ${f.estado}<br>
                        ${f.dias}<br>${f.horario}<br>
                        <p>${f.feirantes_count} feirante(s)</p>
                        <a href="${f.url}" class="btn btn-sm btn-primary">Ver detalhes</a>
                    `);
                marcadores.push(marker);
            }
        });

        // Localização do usuário
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const userMarker = L.marker([pos.coords.latitude, pos.coords.longitude], { icon: userIcon })
                        .addTo(mapa)
                        .bindPopup('<strong>Você está aqui</strong>');
                    marcadores.push(userMarker);
                    mapa.fitBounds(L.featureGroup(marcadores).getBounds(), { padding: [50,50] });
                },
                err => {
                    if (marcadores.length > 0) {
                        mapa.fitBounds(L.featureGroup(marcadores).getBounds(), { padding: [50,50] });
                    }
                }
            );
        } else {
            if (marcadores.length > 0) {
                mapa.fitBounds(L.featureGroup(marcadores).getBounds(), { padding: [50,50] });
            }
        }

        document.getElementById('feiras-count').textContent = feiras.length;
        document.getElementById('markers-count').textContent = marcadores.length;
    });
</script>
{% endblock %}
