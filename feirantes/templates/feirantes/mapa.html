{% extends 'feirantes/base.html' %}
{% load static %}

{% block title %}Mapa das Feiras{% endblock %}

{% block content %}
<h2 class="mb-4">Mapa das Feiras</h2>

<div id="mapa" style="height: 400px; width: 100%;"></div>

<div class="mt-3 p-3 bg-light rounded">
    <h5>Informações:</h5>
    <p>Feiras carregadas: <span id="feiras-count">0</span></p>
    <p>Marcadores adicionados: <span id="markers-count">0</span></p>
</div>

<!-- Estilo responsivo adicional -->
<style>
    @media (max-width: 768px) {
        #mapa {
            height: 300px !important;
        }
        
        .leaflet-popup-content {
            margin: 8px 12px;
            line-height: 1.4;
            font-size: 13px;
        }
        
        .leaflet-popup-content .btn {
            margin-top: 8px;
            width: 100%;
        }
        
        .leaflet-container {
            font-size: 12px;
        }
        
        .leaflet-tooltip {
            font-size: 12px;
            padding: 4px 6px;
        }
    }
    
    @media (max-width: 480px) {
        #mapa {
            height: 250px !important;
        }
        
        .leaflet-popup-content {
            font-size: 12px;
            max-width: 200px;
        }
    }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" defer></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

<script>
    const feiras = {{ feiras_json|safe }};
    const feiraIconUrl = "{% static 'global/img/marker-verde.png' %}";
    const userIconUrl = "{% static 'global/img/user-marker.png' %}";

    document.addEventListener("DOMContentLoaded", function () {
        // Configuração inicial do mapa
        const mapa = L.map('mapa', {
            zoomControl: true,
            attributionControl: true,
            preferCanvas: false
        }).setView([-20.5560, -48.5678], 13);
        
        // Camada de tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(mapa);

        let marcadores = [];

        // Ícones personalizados
        const feiraIcon = L.icon({
            iconUrl: feiraIconUrl,
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
            shadowSize: [41, 41],
            shadowAnchor: [12, 41]
        });

        const userIcon = L.icon({
            iconUrl: userIconUrl,
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
            shadowSize: [41, 41],
            shadowAnchor: [12, 41]
        });

        // Função para criar popup responsivo
        function criarPopup(feira) {
            const isMobile = window.innerWidth <= 768;
            const maxWidth = isMobile ? 250 : 300;
            
            return `
                <div style="min-width: ${isMobile ? '180px' : '220px'};">
                    <strong style="font-size: ${isMobile ? '14px' : '16px'};">${feira.nome}</strong><br>
                    <small style="color: #666; font-size: ${isMobile ? '11px' : '12px'};">
                        ${feira.endereco}, ${feira.cidade} - ${feira.estado}
                    </small><br>
                    <small style="color: #333; font-size: ${isMobile ? '11px' : '12px'};">
                        ${feira.dias}<br>
                        ${feira.horario}
                    </small><br>
                    <small style="color: #555; font-size: ${isMobile ? '11px' : '12px'};">
                        ${feira.feirantes_count} feirante(s)
                    </small><br>
                    <a href="${feira.url}" 
                       class="btn btn-sm btn-primary mt-2" 
                       style="font-size: ${isMobile ? '11px' : '12px'}; padding: ${isMobile ? '4px 8px' : '6px 12px'};">
                        Ver detalhes
                    </a>
                </div>
            `;
        }

        // Função para criar tooltip responsivo
        function criarTooltip(feira) {
            const isMobile = window.innerWidth <= 768;
            return `<strong style="font-size: ${isMobile ? '12px' : '14px'};">${feira.nome}</strong><br>
                    <small style="font-size: ${isMobile ? '10px' : '11px'};">${feira.endereco}</small>`;
        }

        // Adicionar marcadores das feiras
        feiras.forEach(feira => {
            if (feira.latitude && feira.longitude) {
                const marker = L.marker([feira.latitude, feira.longitude], { 
                    icon: feiraIcon,
                    riseOnHover: true
                }).addTo(mapa);

                // Configurar tooltip (hover)
                marker.bindTooltip(criarTooltip(feira), { 
                    permanent: false, 
                    direction: "top",
                    offset: [0, -10]
                });

                // Configurar popup (clique)
                marker.bindPopup(criarPopup(feira), {
                    maxWidth: window.innerWidth <= 768 ? 250 : 300,
                    className: 'popup-feira'
                });

                // Eventos para dispositivos móveis e desktop
                marker.on('click', function(e) {
                    // No mobile, abrir popup ao clicar
                    marker.openPopup();
                });

                // Apenas para desktop - hover
                if (window.innerWidth > 768) {
                    marker.on('mouseover', function(e) {
                        marker.openTooltip();
                    });
                    
                    marker.on('mouseout', function(e) {
                        marker.closeTooltip();
                    });
                }

                marcadores.push(marker);
            }
        });

        // Localização do usuário
        function adicionarLocalizacaoUsuario() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const userMarker = L.marker([pos.coords.latitude, pos.coords.longitude], { 
                            icon: userIcon 
                        }).addTo(mapa);

                        userMarker.bindTooltip("Você está aqui", { 
                            direction: "top",
                            permanent: false 
                        });
                        
                        marcadores.push(userMarker);
                        
                        // Ajustar vista para incluir todos os marcadores
                        if (marcadores.length > 0) {
                            const group = new L.featureGroup(marcadores);
                            mapa.fitBounds(group.getBounds(), { 
                                padding: [20, 20],
                                maxZoom: 15
                            });
                        }
                        
                        document.getElementById('markers-count').textContent = marcadores.length;
                    },
                    err => {
                        console.log('Erro ao obter localização:', err);
                        // Ajustar vista apenas para as feiras
                        if (marcadores.length > 0) {
                            const group = new L.featureGroup(marcadores);
                            mapa.fitBounds(group.getBounds(), { 
                                padding: [20, 20],
                                maxZoom: 15
                            });
                        }
                        document.getElementById('markers-count').textContent = marcadores.length;
                    },
                    {
                        timeout: 10000,
                        enableHighAccuracy: false
                    }
                );
            } else {
                // Navegador não suporta geolocalização
                if (marcadores.length > 0) {
                    const group = new L.featureGroup(marcadores);
                    mapa.fitBounds(group.getBounds(), { 
                        padding: [20, 20],
                        maxZoom: 15
                    });
                }
                document.getElementById('markers-count').textContent = marcadores.length;
            }
        }

        // Atualizar contadores
        document.getElementById('feiras-count').textContent = feiras.length;
        
        // Adicionar localização do usuário
        adicionarLocalizacaoUsuario();

        // Ajustar mapa quando a tela é redimensionada
        window.addEventListener('resize', function() {
            setTimeout(function() {
                mapa.invalidateSize();
            }, 100);
        });

        // Melhorar experiência em dispositivos touch
        if ('ontouchstart' in window) {
            mapa.getContainer().style.cursor = 'pointer';
        }
    });
</script>
{% endblock %}
