{% extends 'feirantes/base.html' %}

{% block title %}Acesso Negado{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="alert alert-danger text-center">
                <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                <h2>Acesso Negado</h2>
                <p>Você não tem permissão para acessar esta página.</p>
                <p class="text-muted">Faça login ou complete seu cadastro como feirante.</p>
                <div class="mt-3">
                    <a href="{% url 'login' %}" class="btn btn-primary me-2">Fazer Login</a>
                    <a href="{% url 'feirantes:cadastro' %}" class="btn btn-success">Cadastrar como Feirante</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
