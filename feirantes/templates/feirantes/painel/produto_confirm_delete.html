{% extends 'feirantes/base.html' %}
{% block content %}
<div class="container">
  <h4>Excluir Produto</h4>
  <p>Tem certeza que deseja excluir <strong>{{ produto.nome }}</strong>?</p>
  <form method="post">{% csrf_token %}
    <a class="btn btn-secondary" href="{% url 'feirantes:produtos' %}">Cancelar</a>
    <button class="btn btn-danger" type="submit">Confirmar exclusão</button>
  </form>
</div>
{% endblock %}
