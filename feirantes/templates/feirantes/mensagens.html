<div class="position-fixed top-50 start-50 translate-middle-x p-3" style="z-index:1080;">
    {% for message in messages %}
    <div class="toast align-items-center {{ message.level_tag }} border-0 show " role="alert" aria-live="assertive"
        aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                {{ message }}
            </div>
            <button type="button" class="btn-close btn-close-black me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
        </div>
    </div>
    {% endfor %}
</div>

<style>
    .toast {
        font-size: 1.1rem;
        font-weight: 700;
        /* ocupa até 90% da tela em dispositivos pequenos */
        max-width: 90vw;
        width: auto;

        /* garante que o texto possa quebrar */
        white-space: normal !important;
        overflow-wrap: break-word !important;
        word-break: break-word !important;

        /* permite que o toast cresça em altura */
        height: auto !important;
        min-height: auto;
    }

    .toast-body {
        white-space: normal !important;
        overflow-wrap: break-word !important;
        word-break: break-word !important;
    }

    .alert-info {
        background-color: #DBEAFE;
        color: #1E3A8A;
    }

    .alert-danger {
        background-color: #FEE2E2;
        color: #991B1B;
    }

    .alert-success {
        background-color: #DCFCE7;
        color: #166534;
    }

    .alert-warning {
        background-color: #FEF9C3;
        color: #92400E;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.toast').forEach(toastEl => {
            // verifica se tem classe de sucesso ou informação
            if (toastEl.classList.contains('alert-success') || toastEl.classList.contains('alert-info')) {
                // some automaticamente depois de 1s
                new bootstrap.Toast(toastEl, { delay: 1000, autohide: true }).show();
            } else {
                // permanece até o usuário fechar
                new bootstrap.Toast(toastEl, { autohide: false }).show();
            }
        });
    });

</script>
